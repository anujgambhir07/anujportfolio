<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Graphic design and video editing portfolio.">
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a href="#top" class="logo" id="navName"></a>
  <nav>
    <a href="#work">Work</a>
    <a href="#clients">Clients</a>
    <a href="#contact" class="pill">Hire me</a>
  </nav>
</header>

<main id="top">
  <section class="hero" id="hero">
    <canvas id="netBack" aria-hidden="true"></canvas>
    <div class="scene" id="scene"><div class="sphere" id="sphere"></div></div>
    <canvas id="netFront" aria-hidden="true"></canvas>
    <div class="hero-foot">
      <p class="eyebrow" id="role"></p>
      <h1 id="tagline"></h1>
      <p id="hint"></p>
      <a class="down" href="#work" aria-label="Scroll to work">↓</a>
    </div>
  </section>

  <section id="work">
    <div class="head">
      <h2>All work</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="about" id="about">
    <p id="about-text"></p>
    <ul class="tools" id="tools"></ul>
  </section>

  <section id="clients">
    <h2>Worked with</h2>
    <div class="clients" id="clientGrid"></div>
  </section>

  <section id="contact" class="contact">
    <h2>Let’s work together</h2>
    <a class="big" id="mail"></a>
    <a class="ig" id="ig" target="_blank" rel="noopener"></a>
  </section>
</main>

<footer><span id="year"></span> <span id="foot"></span></footer>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true">
  <button class="vx" id="vClose" aria-label="Close">×</button>
  <button class="vnav prev" id="vPrev" aria-label="Previous">‹</button>
  <div class="stage" id="stage"></div>
  <button class="vnav next" id="vNext" aria-label="Next">›</button>
  <div class="vcap"><b id="vTitle"></b><span id="vCount"></span><p id="vDesc"></p><div class="dots" id="vDots"></div></div>
</div>

<script src="config.js"></script>
<script src="main.js"></script>
</body>
</html>
